<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T-80U 부위별 원본 대조</title><style>
*{box-sizing:border-box}body{margin:0;background:#1c241e;color:#e6eadf;font:14px/1.5 system-ui}header{padding:20px 24px;border-bottom:1px solid #58634c}h1{margin:0;font-size:20px}p{color:#bcc5b1;margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:8px;padding:18px 24px}button{padding:9px 15px;border:1px solid #657557;border-radius:5px;color:#e6eadf;background:#2d3a29;cursor:pointer}button[aria-pressed=true]{background:#cedcae;color:#1c241e}main{padding:0 24px 24px}.tools{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:0 0 15px}.tools label{display:flex;gap:8px;align-items:center}input{accent-color:#c7db99}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{min-width:0;background:#fafaf6;color:#29332a;padding:12px;border-radius:5px}.panel h2{font-size:13px;margin:0 0 10px}svg{display:block;width:100%;height:auto}#modelSvg.outline #model path{fill:none;stroke:#c72438;stroke-width:.9}#modelSvg.hideTurret [data-part=turret]{display:none}.note{font-size:12px}a{color:#c7db99}.gun .panels{grid-template-columns:1fr}.gun svg{max-height:240px}.stats{font-size:12px;color:#dce4cf;margin:12px 0}table{border-collapse:collapse}td,th{padding:5px 10px;border:1px solid #58634c}th{text-align:left}@media(max-width:850px){.panels{grid-template-columns:1fr}header,nav{padding:14px}main{padding:0 14px 20px}}
</style><header><h1>T-80U · 부위별 원본 대조</h1><p>같은 원본 좌표와 동일 축척으로 비교합니다. 원본의 가려진 부분은 확인 가능한 윤곽과 구분합니다.</p></header>
<nav id="regions"><button data-region="full" aria-pressed="true">전체</button><button data-region="gun">주포</button><button data-region="front">차체 전면</button><button data-region="turret">포탑·반응장갑</button><button data-region="rear">엔진 데크</button></nav>
<main><div class="tools"><label>모델 불투명도 <input id="alpha" type="range" min="0" max="100" value="55"><output id="alphaValue">55%</output></label><label><input id="outline" type="checkbox">빨간 윤곽선</label><label><input id="hideTurret" type="checkbox">포탑·주포 숨기기</label></div><div class="panels"><section class="panel"><h2>원본 도면</h2><svg id="sourceSvg" xmlns="http://www.w3.org/2000/svg"></svg></section><section class="panel"><h2>원본 + 수정 모델</h2><svg id="modelSvg" xmlns="http://www.w3.org/2000/svg"></svg></section></div><p id="note" class="note"></p><div class="stats" id="stats"></div><p class="note"><a href="https://btvt.info/1inservice/t-80u.htm">BTVT / Object 219СБ1 도면</a> · NSVT 미장착 도면에 맞춰 이 대조 화면에서는 기관총을 표시하지 않습니다.</p></main>
<script>__MODEL__</script><script>
(()=>{'use strict';const A=T80UTopView,$=id=>document.getElementById(id),image='__PLAN__';
const regions={full:[35,505,1255,475],gun:[44,724,581,42],front:[373,613,330,259],turret:[602,521,468,447],rear:[990,606,280,280]};
const notes={full:'원본 종횡비를 유지한 전체 외곽 대조입니다.',gun:'포신 외경·배연기·고정 링을 구간별로 비교합니다. 125mm 구경을 포신 외경으로 쓰지 않았습니다.',front:'차체 전면 장갑판은 주포 아래까지 연속합니다. 숨기기를 켜면 가려진 부분을 볼 수 있습니다. 원본에서 주포가 가리는 좁은 구간의 이음선은 주변 판 배열에서 추정했습니다.',turret:'전면 부채꼴 장갑판·지지판, 불규칙한 지붕 판 배열, 두 해치와 후방 수납부를 대조합니다.',rear:'큰 압형 엔진 덮개, 펜더 리브와 후방 브래킷을 대조합니다.'};
let region='full';function render(){const v=regions[region];document.body.classList.toggle('gun',region==='gun');for(const id of ['sourceSvg','modelSvg']){$(id).setAttribute('viewBox',v.join(' '));$(id).setAttribute('width',v[2]);$(id).setAttribute('height',v[3]);const clip=`<defs><clipPath id="${id}Clip"><rect x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}"/></clipPath></defs>`;$(id).innerHTML=clip+`<g clip-path="url(#${id}Clip)"><image href="${image}" width="2000" height="1003"/>`+(id==='modelSvg'?`<g id="model" opacity="${Number($('alpha').value)/100}" transform="translate(807 741) scale(${1/A.MODEL.metresPerPixel})">${A.svgBody({heading:180,mgMounted:false})}</g>`:'')+'</g>';}
$('modelSvg').classList.toggle('outline',$('outline').checked);$('modelSvg').classList.toggle('hideTurret',$('hideTurret').checked);$('alphaValue').textContent=$('alpha').value+'%';$('note').textContent=notes[region];document.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.region===region));$('stats').innerHTML=region==='gun'?'<table><tr><th>원본 X 위치</th><th>원본 외경</th><th>수정 전</th><th>수정 후</th></tr><tr><td>100 px</td><td>18 px</td><td>12 px</td><td>18 px</td></tr><tr><td>180 px</td><td>20 px</td><td>13 px</td><td>20 px</td></tr><tr><td>500 px</td><td>23 px</td><td>16 px</td><td>22 px</td></tr></table>':'';}
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;render();});for(const id of ['alpha','outline','hideTurret'])$(id).oninput=render;render();})();
</script></html>
